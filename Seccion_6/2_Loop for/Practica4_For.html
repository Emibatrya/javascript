<!DOCTYPE html>
<html>
<head>
    <title>Practica 4 Loop For</title>
</head>

<body>
    <script>
        function testLoop(num){
        for (x = 1; x < 11; x++) {
            let resultado = num * x
             
            document.write(num + "x" + x + ":" + resultado + "<br>");
             }
            }
    </script>
</body>

</html>
