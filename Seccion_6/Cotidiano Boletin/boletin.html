<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Boletín estudiantil</title>
  <link rel="stylesheet" href="style.css">
  <script src="parteJava.js"></script>
</head>
<body>
  <h1>Bienvenido a tu boletín estudiantil</h1>

  <h2>Alumno: Bruce Wayne</h2>

  <h3>Notas:</h3>
  <ul id="listaNotas"></ul>

  <h3>Promedio:</h3>
  <button onclick="calcularPromedio()">Calcular promedio</button>
  <p id="resultadoPromedio"></p>

  <h3>Nota más alta:</h3>
  <button onclick="notaMasAlta()">Buscar nota más alta</button>
  <p id="resultadoAlta"></p>

  <h3>¿Hubo algún aplazado?</h3>
  <button onclick="hayAplazados()">Consultar aplazados</button>
  <p id="resultadoAplazados"></p>

</body>
</html>
