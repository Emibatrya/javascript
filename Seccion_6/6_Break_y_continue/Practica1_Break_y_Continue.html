<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pratica 1 break y continue</title>
</head>
<body>
    <script>
        let miArray = ['A', 'A', 'B', 'A', 'B', 'B', 'A'];

        function testLoop() {
            for (let letra of miArray) {
                if (letra == 'B') {
                    break;
                } else {
                    console.log(letra);
                }
            }
            console.log("Esto es todo");
        }


    </script>
</body>
</html>
