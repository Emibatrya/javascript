<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practica 2 de break y continue</title>
</head>
<body>
    <script>
        let miArray = [9, 5, 6, 2, 7];

        function testLoop() {
            for (let numero of miArray) {
                if (numero <= 5) {
                    continue;
                }
                console.log(numero);
            }
        }
    </script>
</body>
</html>
