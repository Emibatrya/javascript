<!DOCTYPE html>
<html>
    <head>
        <title>Practica 1 For Of</title>
    </head>
    <body>
        <script>
            let miArray = [5, 9, 6, 4, 8];
            let suma = 0;

            function testloop(miArray){ 
                for(let numero of miArray) {
                    suma = suma + numero;
                }
                console.log(suma);
            }
            testloop(miArray)
        </script>
    </body>
</html>
