<!DOCTYPE html>
<html>
<head>
    <title>Practica loop do while 2</title>
</head>
<body>
    <script>
        function tablaMultiplicar() {
            let numero = prompt("Dime un numero");
            let contador = 1;

            do {
                console.log(numero + " x " + contador + " = " + (numero * contador));
                contador++;
            } while (contador <= 10);
        }

        tablaMultiplicar();
    </script>
</body>
</html>
