<!DOCTYPE html>
<html>
<head>
    <title>Practica loop do while 1</title>
</head>
<body>
    <script>
        let numeroVueltas;

        do {
            numeroVueltas = prompt("Dime mi numeroVueltas");
        } while (numeroVueltas != "20");

        document.write("<h1>Esas son las verdaderas vueltas</h1>")
    </script>
</body>
</html>
