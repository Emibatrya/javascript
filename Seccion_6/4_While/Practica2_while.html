<!DOCTYPE html>
<html>
    <head>
        <title>Practica while 2</title>
    </head>
    <body>
        <script>
            function testLoop(numero){
                while (numero < 10){
                    numero++;
                    console.log(numero);
                }
            }

            let numeroInicial = prompt("Dime un numero");
            testLoop(numeroInicial);
        </script>
    </body>
</html>
