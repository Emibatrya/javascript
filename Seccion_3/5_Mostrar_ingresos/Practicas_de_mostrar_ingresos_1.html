<!DOCTYPE html>
<html>

<head>
    <title>Ingresos de usuario 1</title>
</head>

<body>

    <p>Ingresa tu fruta</p>

    <input type="text" id="inputTexto">
    <button onclick="mostrarTexto()">Click aqui</button>
    <h1 id="titulo">No se tu fruta favorita</h1>

    <script>

        function mostrarTexto() {
            let fruta = document.getElementById("inputTexto")
            let nombreFruta = document.getElementById("titulo");
            let mensaje = "Tu fruta favorita es " + fruta.value

            nombreFruta.textContent = mensaje;

        }
    </script>

</body>

</html>
