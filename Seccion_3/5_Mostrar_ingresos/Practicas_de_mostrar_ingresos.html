<!DOCTYPE html>
<html>

<head>
    <title>Ingresos de usuario 2</title>
</head>

<body>

    <p>Ingresa tu cantante</p>

    <input type="text" id="inputTexto">
    <button onclick="mostrarTexto()">Click aqui</button>
    <h1 id="titulo">No se tu cantante favorito</h1>

    <script>

        function mostrarTexto() {
            let Cantante = document.getElementById("inputTexto")
            let nombreCantante = document.getElementById("titulo");
            let mensaje = "Ahora si se tu cantante favorito y es " + Cantante.value

            nombreCantante.textContent = mensaje;

        }
    </script>

</body>

</html>
