<!DOCTYPE html>
<html>
<head>
    <title>Fecha y hora 1</title>
</head>
<body>
    <p>
        <button onclick="mostrarFecha()">Click aquí</button>
    </p>
    <script>
        function mostrarFecha() {
            let hoy = new Date();
            alert(hoy.toLocaleDateString('es-ES'));
        }
    </script>
</body>
</html>
