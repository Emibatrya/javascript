<!DOCTYPE html>
<html>
<head>
    
    <title>Audio 1</title>
<style>
    audio::-webkit-media-controls-panel {
        background-color: blue;
    }
</style>
</head>
<body>

 <audio id="audioAlarma" controls>
    <source src="Audios/alarma.mp3" type="audio/mpeg">
    
</audio>
<script>
    let LlamarFuncion= document.getElementById("audioAlarma")

    function inciarSonido() {

       LlamarFuncion.play();

    }
    function tiempoCumplido(){
        setTimeout(inciarSonido,3000);
    }
    tiempoCumplido()
</script>
    
</body>
</html>
