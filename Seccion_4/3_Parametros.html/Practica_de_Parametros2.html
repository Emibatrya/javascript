<!DOCTYPE html>
<html lang="en">
<head>

    <title>Practica de parametros 2</title>
</head>
<body>
    <input type="text" id="texto1">
    <button onclick="mostrarMensaje()">Presione aqui para ver su mensaje</button>

    <script>

        function mostrartexto(texto1){

            mensaje = texto1
            return mensaje;
        }

        function mostrarMensaje(){

            let mensaje1 = (document.getElementById("texto1"));

            let mensajeFinal = mostrartexto(mensaje1.value);

            alert(mensajeFinal);
        }

    </script>

</body>
</html>
