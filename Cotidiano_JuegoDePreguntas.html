<!DOCTYPE html>
<html lang="en">

<head>

    <title>Cotidiano Juego de preguntas</title>
    <link rel="stylesheet" href="misEstilos.css">
    <style>
        #contador {
            font-size: 1em;
            margin: 10px;


        }

        button {

        input {

<body onload="ComenzarTiempo()">
    <H1>Responde las preguntas lo mas rapido que puedas
        <div id="contador">30</div>
        <script>
            let tiempo = 30;
            let intervalo

            function ComenzarTiempo() {
                if (!intervalo) {

                    intervalo = setInterval(restador, 1000);

                }
            }


            function actualizarContador() {
                document.getElementById("contador").textContent = tiempo;

            }

            function restador() {
                if (tiempo > 0) {
                    tiempo--;
                    actualizarContador();

                } else {
                    (tiempo = 0)
                    alert("Se le acabo el tiempo");
                }
            }


        </script>
    </h1>

    <p>
    <h2>1. Cuanto es 1+1</b> </h2>
    </p>
    <input type="text" id="Pregunta_1">

    <h1><button onclick="Enviarrespuestas()">Termine</button></h1>

    <script>
